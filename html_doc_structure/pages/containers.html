<!DOCTYPE html>
<html>
    <body>
        <!-- <div> General Purpose Container used to group elements together
            when there isn't a more meaningful semantic element -->
        <!-- It doesn't communicate what the content means -->
        <div>
            <h2>My Profile</h2>
            <p>I am learning web development</p>
        </div>
        <!-- <span> Small Inline Container used inside a line of content -->
        <!-- Doesn't create a new paragraph or section -->
        <p>
            My favourite language is <span>Javascript</span>.
        </p>
        <!-- Later CSS might be used to style just that word -->
        <p>Your balance is <span>$5000</span></p>
        
        <!-- BLOCK vs INLINE -->
        <!-- BLOCK Elements start on a new line, 
            take up the available width by default -->
            <!-- Examples: <div>, <p>, <h1> - <h6>, <section>, <article>, <header>, <footer> -->
        <p>First paragraph</p>
        <p>Second paragraph</p>
        <!-- INLINE Elements stay within the same line, 
               take only the space their content needs 
               Example: <span>, <a>, <strong>, <em> -->
        <p>
            I am learning <strong>HTML</strong> and <strong>CSS</strong>.
        </p>

    </body>
</html>
