<!DOCTYPE html>
<html>
    <body>
        <!-- The <img> element - it doesn't have a closing tag like <p>, <h1>, Its called a voic element-->
        <h1>
            <img src="../images/svplogo.png" alt="The logo of SVP" width="300" height="300">
        </h1>
        <!-- src means source, it tells browser where the image is located -->
         <!-- alt means alternative text, Purpose:
          If image fails to load, browser can display alternative text,
          Screen readers can describe the image to someone who cant see it -->
        <br>
        <!-- ABSOLUTE IMAGE URLs -->
        <h1>
            <img src="https://content.lyka.com.au/f/1016262/1104x676/e36872ce32/beagle.png/m/1280x720/smart/filters:format(webp)" 
            alt="A Beagle" width="600" height="300">
        </h1>
        <br>
        <!-- To use an image hostel somewhere else -->
        <img src="../images/svplogo.png" alt="Logo of SVP" width="300" height="300">
        <!-- To specify dimensions with width and height-->
        <br>
        <!--  To make an image clickable -->
        <a href="about.html">
            <img src="../images/svplogo.png" alt="View About" width="300" height="300">
        </a>
    </body>
</html>
