<!DOCTYPE html>
<html>
    <body>
        <!-- <form> groups controls that collect user input -->
        <form>
            <label for="email">Email</label>
            <!-- <input> creates text input -->
              <!-- Placeholder is the hint shown inside empty text input -->
              <!-- Label tells the user what an input is for -->
              <!-- Name identifies the form field name of the data being submitted -->
              <!-- id identifies the element in the page -->
              <!-- Value represents the input's default/current value -->
            <input 
                type="text" 
                id="email" 
                name="email"               
                placeholder="Enter your email">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Enter your password">
            <!-- 3 types of buttons - submit, button, reset -->
             <!--1. submits the form, 2. normal button(doesn't submit by default), 3. resets form controls  -->
            <button type="submit">Login</button>
        </form>

    </body>
</html>
