<!DOCTYPE html>
<html>
    <head>
        <title>Navigation</title>
    </head>
    <body>
        <h1></h1>
        <!-- LINKS & NAVIGATION
        <a> means anchor
        Syntax: <a href="https://www.google.com">Go to Google</a>
        Here → <a> : Anchor Element
        href : attribute
        URL : attribute value
        Go to Google : clickable text-->
        <h1><a href="https://www.google.com">Go to Google</a></h1>
        <!-- ATTRIBUTE URLs
        An absolute URL contains complete web address:
        <a href="https://www.google.com">Google</a>
        <a href="https://www.youtube.com">Youtube</a>
        <a href="https://www.github.com">Github</a>
        *Use absolute URLs when linking to another website-->
        <h1><a href="index.html">Index</a></h1>
        <!-- RELATIVE URLs
        For Own Website: Suppose your project has 
        →index.html, about.html, contact.html
        From index.html, you can write <a href="about.html">About</a>, <a href="contact.html">Contact</a>-->
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
        

    </body>
</html>
